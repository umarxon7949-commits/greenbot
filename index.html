<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GREEN TASHKENT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0e1512; --bg2:#141d18; --card:#18241d; --line:#26352b;
    --green:#3ddc84; --green-dim:#1f7a4d; --amber:#f5b53d; --red:#ff6b6b;
    --txt:#e8f0ea; --muted:#7d9387;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--txt);
    font-family:"Georgia","Times New Roman",serif;
    padding-bottom:78px;line-height:1.4;
  }
  .num,.kpi-val,.bar-val,th,td,.seg,.mbtn{font-family:"Trebuchet MS","Segoe UI",sans-serif}
  header{
    padding:22px 18px 16px;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(61,220,132,.16), transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg));
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .logo{
    width:40px;height:40px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,var(--green),var(--green-dim));
    display:grid;place-items:center;font-size:22px;
    box-shadow:0 6px 18px rgba(61,220,132,.25);
  }
  .brand h1{font-size:21px;letter-spacing:.5px;font-weight:700}
  .brand .sub{font-size:12px;color:var(--muted);font-family:"Trebuchet MS",sans-serif}
  .content{padding:16px 14px}
  .seg{
    display:flex;gap:6px;overflow-x:auto;padding:12px 14px;
    border-bottom:1px solid var(--line);scrollbar-width:none;
  }
  .seg::-webkit-scrollbar{display:none}
  .mbtn{
    flex:none;padding:7px 13px;border-radius:20px;font-size:13px;
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    transition:.18s;white-space:nowrap;
  }
  .mbtn.on{background:var(--green);color:#06170d;border-color:var(--green);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:13px;
  }
  .card h2{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:.4px;
    text-transform:uppercase;margin-bottom:13px;font-family:"Trebuchet MS",sans-serif}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}
  .kpi .lbl{font-size:11px;color:var(--muted);font-family:"Trebuchet MS",sans-serif;text-transform:uppercase;letter-spacing:.5px}
  .kpi-val{font-size:23px;font-weight:700;margin-top:5px}
  .kpi-val.amber{color:var(--amber)} .kpi-val.green{color:var(--green)}
  .kpi .unit{font-size:12px;color:var(--muted);font-weight:400}
  .bar-row{margin-bottom:13px}
  .bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .bar-top .nm{color:var(--txt)} .bar-top .vl{color:var(--muted);font-family:"Trebuchet MS",sans-serif}
  .bar-track{height:9px;background:#0c130f;border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green-dim),var(--green));
    width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .bar-fill.amber{background:linear-gradient(90deg,#8a5a10,var(--amber))}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:400;font-size:11px;text-transform:uppercase;
    padding:7px 6px;border-bottom:1px solid var(--line);letter-spacing:.4px}
  td{padding:9px 6px;border-bottom:1px solid #1d2a22}
  td.r,th.r{text-align:right}
  tr:last-child td{border-bottom:none}
  .tot{font-weight:700;color:var(--green)}
  .donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-family:"Trebuchet MS",sans-serif}
  .legend .it{display:flex;align-items:center;gap:8px}
  .dot{width:11px;height:11px;border-radius:3px;flex:none}
  nav{
    position:fixed;bottom:0;left:0;right:0;display:flex;
    background:rgba(20,29,24,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
  }
  nav button{
    flex:1;background:none;border:none;color:var(--muted);padding:11px 0 13px;
    font-size:11px;font-family:"Trebuchet MS",sans-serif;display:flex;
    flex-direction:column;align-items:center;gap:3px;transition:.15s;
  }
  nav button .ic{font-size:20px}
  nav button.on{color:var(--green)}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hint{font-size:11px;color:var(--muted);text-align:center;padding:6px 0 2px;font-family:"Trebuchet MS",sans-serif}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏗</div>
    <div>
      <h1>GREEN TASHKENT</h1>
      <div class="sub">Панель учёта строительства</div>
    </div>
  </div>
</header>

<div class="seg" id="seg"></div>
<div class="content" id="content"></div>

<nav>
  <button data-tab="summary" class="on"><span class="ic">📊</span>Сводка</button>
  <button data-tab="intake"><span class="ic">🏗</span>Приход</button>
  <button data-tab="concrete"><span class="ic">🧱</span>Бетон</button>
  <button data-tab="stock"><span class="ic">📦</span>Остаток</button>
</nav>

<script>
let DATA = {months:[],sums:{},usd:{},intake:{},stock:[]};
try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}

const PAL=["#3ddc84","#f5b53d","#5fb0ff","#ff8a5f","#c08aff","#46d6c4","#ff6b9d","#b6d94c"];
let tab="summary", mi=-1;

function fmt(n){ if(n==null) return "—";
  n=Math.round(n*100)/100;
  let s=(n%1===0?n.toString():n.toFixed(2));
  return s.replace(/\B(?=(\d{3})+(?!\d))/g," "); }

function activeMonths(){
  // индексы месяцев, где есть расходы
  const out=[]; DATA.months.forEach((m,i)=>{
    let t=0; for(const c in DATA.sums){ const v=DATA.sums[c][i]; if(v) t+=v; }
    if(t) out.push(i);
  }); return out;
}
function monthsForIntake(){ return Object.keys(DATA.intake); }

function seg(items,cur,onPick){
  const el=document.getElementById("seg"); el.innerHTML="";
  items.forEach(it=>{
    const b=document.createElement("button");
    b.className="mbtn"+(it.key===cur?" on":""); b.textContent=it.label;
    b.onclick=()=>onPick(it.key); el.appendChild(b);
  });
}

function donut(parts){ // parts:[{label,val,color}]
  const tot=parts.reduce((s,p)=>s+p.val,0)||1, R=52,C=2*Math.PI*R; let off=0;
  let circles=parts.map(p=>{
    const len=p.val/tot*C, c=`<circle cx="65" cy="65" r="${R}" fill="none"
      stroke="${p.color}" stroke-width="20"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 65 65)"/>`; off+=len; return c;
  }).join("");
  const leg=parts.map(p=>`<div class="it"><span class="dot" style="background:${p.color}"></span>
     ${p.label} · ${(p.val/tot*100).toFixed(1)}%</div>`).join("");
  return `<div class="donut-wrap"><svg width="130" height="130" viewBox="0 0 130 130">
    ${circles}<text x="65" y="60" text-anchor="middle" fill="#7d9387" font-size="10"
    font-family="Trebuchet MS">ИТОГО</text>
    <text x="65" y="76" text-anchor="middle" fill="#e8f0ea" font-size="13"
    font-family="Trebuchet MS" font-weight="bold">${parts.length} кат.</text></svg>
    <div class="legend">${leg}</div></div>`;
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const C=document.getElementById("content");
  if(tab==="summary") renderSummary(C);
  if(tab==="intake")  renderIntake(C);
  if(tab==="concrete") renderConcrete(C);
  if(tab==="stock")   renderStock(C);
}

function renderSummary(C){
  const idx=mi;
  seg([{key:-1,label:"Весь период"},...activeMonths().map(i=>({key:i,label:DATA.months[i].replace(/^\d+г\./,"")}))],
      idx, k=>{ mi=k; render(); });
  const all=idx===-1;
  const cats=Object.keys(DATA.sums);
  const rows=cats.map((c,j)=>{
    let s=0,d=0;
    if(all){ DATA.sums[c].forEach(v=>v&&(s+=v)); (DATA.usd[c]||[]).forEach(v=>v&&(d+=v)); }
    else { s=DATA.sums[c][idx]||0; d=(DATA.usd[c]||[])[idx]||0; }
    return {c,s,d,color:PAL[j%PAL.length]};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
  const tS=rows.reduce((x,r)=>x+r.s,0), tD=rows.reduce((x,r)=>x+r.d,0), mx=rows[0]?.s||1;
  const title=all?"Весь период":DATA.months[idx];
  let h=`<div class="fade">
    <div class="kpis">
      <div class="kpi"><div class="lbl">Итого, сум</div><div class="kpi-val amber">${fmt(tS)}</div></div>
      <div class="kpi"><div class="lbl">Итого, USD</div><div class="kpi-val green">$${fmt(tD)}</div></div>
    </div>
    <div class="card"><h2>Структура расходов · ${title}</h2>
      ${donut(rows.map(r=>({label:r.c,val:r.s,color:r.color})))}</div>
    <div class="card"><h2>По категориям</h2>`;
  rows.forEach(r=>{ h+=`<div class="bar-row">
      <div class="bar-top"><span class="nm">${r.c}</span>
      <span class="vl">${fmt(r.s)} сум${r.d?" · $"+fmt(r.d):""}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${r.s/mx*100}%"></div></div></div>`; });
  h+=`</div></div>`;
  C.innerHTML=h;
  requestAnimationFrame(()=>C.querySelectorAll(".bar-fill").forEach(b=>b.style.width=b.style.width));
}

function renderIntake(C){
  const keys=monthsForIntake();
  if(!keys.includes(intakeKey)) intakeKey=keys[keys.length-1];
  const ruM={"01":"Январь","02":"Февраль","03":"Март","04":"Апрель","05":"Май","06":"Июнь",
    "07":"Июль","08":"Август","09":"Сентябрь","10":"Октябрь","11":"Ноябрь","12":"Декабрь"};
  const lbl=k=>{const[y,m]=k.split("-");return ruM[m]+" "+y;};
  seg(keys.map(k=>({key:k,label:lbl(k)})),intakeKey,k=>{intakeKey=k;render();});
  const b=DATA.intake[intakeKey]||{};
  const rows=Object.entries(b).map(([d,t],j)=>({d,t,color:PAL[j%PAL.length]})).sort((a,b)=>b.t-a.t);
  const tot=rows.reduce((s,r)=>s+r.t,0), mx=rows[0]?.t||1;
  let h=`<div class="fade">
    <div class="kpis">
      <div class="kpi"><div class="lbl">Приход, ${lbl(intakeKey)}</div>
        <div class="kpi-val green">${fmt(tot)}<span class="unit"> т</span></div></div>
      <div class="kpi"><div class="lbl">Позиций (Ø)</div>
        <div class="kpi-val">${rows.length}</div></div>
    </div>
    <div class="card"><h2>Приход по диаметрам · тонны</h2>`;
  rows.forEach(r=>{const nm=r.d==="Катанка"?"Катанка":"Ø "+r.d.slice(1);
    h+=`<div class="bar-row"><div class="bar-top"><span class="nm">${nm}</span>
      <span class="vl">${fmt(r.t)} т</span></div>
      <div class="bar-track"><div class="bar-fill amber" style="width:${r.t/mx*100}%"></div></div></div>`;});
  h+=`</div></div>`;
  C.innerHTML=h;
}
let intakeKey=null;

let concreteKey=null;
function monthsForConcrete(){ return Object.keys(DATA.concrete||{}); }
function renderConcrete(C){
  const keys=monthsForConcrete();
  if(!keys.length){ document.getElementById("seg").innerHTML="";
    C.innerHTML='<div class="card">Нет данных по бетону.</div>'; return; }
  if(!keys.includes(concreteKey) && concreteKey!=="all")
    concreteKey=keys[keys.length-1];
  const ruM={"01":"Январь","02":"Февраль","03":"Март","04":"Апрель","05":"Май","06":"Июнь",
    "07":"Июль","08":"Август","09":"Сентябрь","10":"Октябрь","11":"Ноябрь","12":"Декабрь"};
  const lbl=k=>{const[y,m]=k.split("-");return ruM[m]+" "+y;};
  seg([{key:"all",label:"Весь период"},...keys.map(k=>({key:k,label:lbl(k)}))],
      concreteKey, k=>{concreteKey=k;render();});

  // агрегируем
  const marks={}; let totQ=0,totS=0;
  const src = concreteKey==="all"
    ? Object.values(DATA.concrete)
    : [DATA.concrete[concreteKey]||{}];
  src.forEach(b=>{ for(const mk in b){ const [q,s]=b[mk];
    marks[mk]=marks[mk]||[0,0]; marks[mk][0]+=q; marks[mk][1]+=s; totQ+=q; totS+=s; } });
  const rows=Object.entries(marks).map(([mk,[q,s]],j)=>({mk,q,s,color:PAL[j%PAL.length]}))
    .sort((a,b)=>b.q-a.q);
  const mx=rows[0]?.q||1;
  const title = concreteKey==="all" ? "Весь период" : lbl(concreteKey);

  let h=`<div class="fade">
    <div class="kpis">
      <div class="kpi"><div class="lbl">Объём · ${title}</div>
        <div class="kpi-val green">${fmt(totQ)}<span class="unit"> м³</span></div></div>
      <div class="kpi"><div class="lbl">Сумма</div>
        <div class="kpi-val amber">${fmt(totS)}<span class="unit"> сум</span></div></div>
    </div>
    <div class="card"><h2>Структура по маркам · ${title}</h2>
      ${donut(rows.map(r=>({label:r.mk,val:r.q,color:r.color})))}</div>
    <div class="card"><h2>Марки бетона · м³</h2>`;
  rows.forEach(r=>{ h+=`<div class="bar-row">
    <div class="bar-top"><span class="nm">${r.mk}</span>
    <span class="vl">${fmt(r.q)} м³ · ${fmt(r.s)} сум</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${r.q/mx*100}%"></div></div></div>`; });
  h+=`</div></div>`;
  C.innerHTML=h;
}

function renderStock(C){
  document.getElementById("seg").innerHTML="";
  const rows=DATA.stock;
  const tot=rows.reduce((s,r)=>s+r.ost,0);
  const allZero=tot===0;
  let h=`<div class="fade">
    <div class="kpis">
      <div class="kpi"><div class="lbl">Остаток всего</div>
        <div class="kpi-val ${allZero?'':'green'}">${fmt(tot)}<span class="unit"> т</span></div></div>
      <div class="kpi"><div class="lbl">Диаметров</div>
        <div class="kpi-val">${rows.length}</div></div>
    </div>`;
  if(allZero) h+=`<div class="hint">Остаток = приход − использовано. Сейчас всё израсходовано (0).</div>`;
  h+=`<div class="card"><h2>Остаток арматуры</h2>
    <table><thead><tr><th>Диаметр</th><th class="r">Остаток, т</th></tr></thead><tbody>`;
  rows.forEach(r=>{const nm=r.d==="Катанка"?"Катанка":"Ø "+r.d;
    h+=`<tr><td>${nm}</td><td class="r">${fmt(r.ost)}</td></tr>`;});
  h+=`<tr><td class="tot">ИТОГО</td><td class="r tot">${fmt(tot)}</td></tr>`;
  h+=`</tbody></table></div></div>`;
  C.innerHTML=h;
}

document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{ tab=b.dataset.tab; render(); };
});

async function init(){
  try{
    let initData = "";
    try{ initData = Telegram.WebApp.initData || ""; }catch(e){}
    const r = await fetch("api/data?t="+Date.now(), {
      headers: { "X-Init-Data": initData }
    });
    if(r.status===403){
      document.getElementById("content").innerHTML =
        '<div class="card">⛔ Доступ ограничен. Эта панель доступна только сотрудникам.</div>';
      document.getElementById("seg").innerHTML="";
      return;
    }
    DATA = await r.json();
  }catch(e){
    document.getElementById("content").innerHTML =
      '<div class="card">Не удалось загрузить данные. Обновите страницу.</div>';
    return;
  }
  intakeKey = monthsForIntake()[monthsForIntake().length-1];
  mi = -1;
  render();
}
init();
</script>
</body>
</html>
